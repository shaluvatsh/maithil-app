services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: themaithil
      POSTGRES_PASSWORD: themaithil
      POSTGRES_DB: themaithil
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U themaithil"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
