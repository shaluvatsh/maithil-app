name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @themaithil/contracts build

      - name: Typecheck
        run: pnpm typecheck

      # The integration suites run Postgres compiled to wasm in-process, so CI needs
      # no database service. The ledger invariant and the exclusion constraints are
      # exercised against a real engine.
      - name: Test
        run: pnpm test

      - name: Build web
        run: pnpm --filter @themaithil/web build

      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t themaithil-api:${{ github.sha }} .

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: { group: deploy-production, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      # release_command in fly.toml runs migrations before the new version takes
      # traffic; a failed migration aborts the deploy rather than half-applying.
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
